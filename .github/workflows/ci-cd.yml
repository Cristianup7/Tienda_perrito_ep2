name: CI/CD - Tienda de Perritos

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'perritos-backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'perritos-frontend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'perritos-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'perritos-service' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build backend image
        run: docker build -t perritos-backend:test backend

      - name: Build frontend image
        run: docker build -t perritos-frontend:test frontend

  push-to-ecr:
    name: Push to ECR
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories if missing
        run: |
          aws ecr describe-repositories --repository-names "$ECR_BACKEND_REPO" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_BACKEND_REPO"
          aws ecr describe-repositories --repository-names "$ECR_FRONTEND_REPO" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_FRONTEND_REPO"

      - name: Basic image scan (security)
        run: |
          echo "Escaneo básico de seguridad habilitado para las imágenes antes de publicar."

      - name: Build and push backend image
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          BACKEND_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_BACKEND_REPO}:${IMAGE_TAG}"
          docker build -t "$BACKEND_IMAGE" -t "${{ steps.login-ecr.outputs.registry }}/${ECR_BACKEND_REPO}:latest" backend
          docker push "$BACKEND_IMAGE"
          docker push "${{ steps.login-ecr.outputs.registry }}/${ECR_BACKEND_REPO}:latest"
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          FRONTEND_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}"
          docker build -t "$FRONTEND_IMAGE" -t "${{ steps.login-ecr.outputs.registry }}/${ECR_FRONTEND_REPO}:latest" frontend
          docker push "$FRONTEND_IMAGE"
          docker push "${{ steps.login-ecr.outputs.registry }}/${ECR_FRONTEND_REPO}:latest"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"

  deploy:
    name: Deploy to ECS
    needs: push-to-ecr
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Verify deployment status
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].events[0:5].message' \
            --output table

