name: Pipeline CI/CD EP2

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Backend a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/tienda-backend:latest

      - name: Construir y Subir Frontend a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/tienda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código para enviar a EC2
        uses: actions/checkout@v3

      - name: Copiar archivos al servidor EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/app-tienda"

      - name: Ejecutar Docker Compose en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app-tienda
            docker compose down
            docker compose up -d --build
