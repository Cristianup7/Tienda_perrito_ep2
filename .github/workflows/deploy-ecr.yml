name: Build and Push to ECR (AWS Academy)

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (session)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Debug step removed — pipeline focuses on build & push only

      - name: Set AWS account env
        run: echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Create ECR repos if missing
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.TF_VAR_ecr_backend_repo || 'perritos-backend' }}" >/dev/null 2>&1 || aws ecr create-repository --repository-name "${{ secrets.TF_VAR_ecr_backend_repo || 'perritos-backend' }}"
          aws ecr describe-repositories --repository-names "${{ secrets.TF_VAR_ecr_frontend_repo || 'perritos-frontend' }}" >/dev/null 2>&1 || aws ecr create-repository --repository-name "${{ secrets.TF_VAR_ecr_frontend_repo || 'perritos-frontend' }}"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 526992473234.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push Backend
        run: |
          # Definición manual para evitar errores de variables vacías
          ACCOUNT_ID="526992473234"
          REGION="us-east-1"
          REPO_NAME="perritos-backend"
          FULL_IMAGE_NAME="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO_NAME:latest"
          
          docker build -t $FULL_IMAGE_NAME ./backend
          docker push $FULL_IMAGE_NAME

      - name: Build and Push Frontend
        run: |
          ACCOUNT_ID="526992473234"
          REGION="us-east-1"
          REPO_NAME="perritos-frontend"
          FULL_IMAGE_NAME="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO_NAME:latest"
          
          docker build -t $FULL_IMAGE_NAME ./frontend
          docker push $FULL_IMAGE_NAME

      - name: Output pushed images
        run: |
          echo "Backend image: ${{ env.BACKEND_IMAGE }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}"

      # Terraform steps removed — this workflow only builds and pushes images to ECR
